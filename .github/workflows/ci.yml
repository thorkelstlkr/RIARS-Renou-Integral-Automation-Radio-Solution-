name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  test-linux:
    name: Tests (Linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: System libraries (ALSA for cpal)
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev pkg-config
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # The desktop app needs WebKitGTK on Linux; everything else is tested here.
      # There is no sound card on the runner: the engine uses its internal clock.
      - run: cargo test --workspace --exclude riars-desktop
      - run: cargo build --release -p riars-server

  frontend:
    name: Frontend types
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx tsc --noEmit

  raspberry-pi:
    name: Server for Raspberry Pi (${{ matrix.target }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target:
          - aarch64-unknown-linux-gnu    # Pi 3/4/5 with a 64-bit OS
          - armv7-unknown-linux-gnueabihf # Pi 2/3/4 with a 32-bit OS
    # cross names its Docker image after the checkout folder, and the repository name
    # ends with '-', which Docker rejects: check out into ./riars instead.
    defaults:
      run:
        working-directory: riars
    steps:
      - uses: actions/checkout@v4
        with:
          path: riars
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
          workspaces: riars
      - uses: taiki-e/install-action@v2
        with:
          tool: cross
      - run: cross build --release -p riars-server --target ${{ matrix.target }}
      - uses: actions/upload-artifact@v4
        with:
          name: riars-server-${{ matrix.target }}
          path: riars/target/${{ matrix.target }}/release/riars-server
          if-no-files-found: error
