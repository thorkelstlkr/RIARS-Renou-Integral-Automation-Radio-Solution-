[workspace]
resolver = "2"
members = [
    "crates/riars-core",
    "crates/riars-api",
    "crates/riars-mcp",
    "crates/riars-server",
    "src-tauri",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/thorkelstlkr/RIARS-Renou-Integral-Automation-Radio-Solution-"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
log = "0.4"
env_logger = "0.11"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v4", "serde"] }
thiserror = "2"

# Decoding audio in an unoptimized build takes seconds per track; optimize dependencies
# in dev too (our own crates stay fast to compile).
[profile.dev.package."*"]
opt-level = 3
