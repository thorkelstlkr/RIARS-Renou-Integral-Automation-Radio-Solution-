# Cross-compiling riars-server for the Raspberry Pi with `cross`.
# cpal needs ALSA's headers and library for the target architecture.

[build.env]
passthrough = ["PKG_CONFIG_ALLOW_CROSS"]

[target.aarch64-unknown-linux-gnu]
pre-build = [
    "dpkg --add-architecture $CROSS_DEB_ARCH",
    "apt-get update && apt-get install --assume-yes libasound2-dev:$CROSS_DEB_ARCH",
]
[target.aarch64-unknown-linux-gnu.env]
passthrough = ["PKG_CONFIG_PATH=/usr/lib/aarch64-linux-gnu/pkgconfig", "PKG_CONFIG_ALLOW_CROSS=1"]

[target.armv7-unknown-linux-gnueabihf]
pre-build = [
    "dpkg --add-architecture $CROSS_DEB_ARCH",
    "apt-get update && apt-get install --assume-yes libasound2-dev:$CROSS_DEB_ARCH",
]
[target.armv7-unknown-linux-gnueabihf.env]
passthrough = ["PKG_CONFIG_PATH=/usr/lib/arm-linux-gnueabihf/pkgconfig", "PKG_CONFIG_ALLOW_CROSS=1"]
