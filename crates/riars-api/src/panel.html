<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>RIARS</title>
<style>
  :root { --bg:#0d1117; --panel:#161b22; --input:#21262d; --border:#30363d; --text:#e6edf3; --muted:#8b949e; --accent:#f78c26; --green:#3fb950; --yellow:#d29922; --red:#f85149; }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text); font: 14px/1.4 system-ui, sans-serif; }
  header, section { max-width: 760px; margin: 0 auto; padding: 12px 16px; }
  header { display: flex; align-items: center; gap: 10px; border-bottom: 1px solid var(--border); }
  h1 { margin: 0; font-size: 16px; color: var(--accent); flex: 1; }
  h2 { font-size: 12px; text-transform: uppercase; letter-spacing: 1px; color: var(--muted); margin: 0 0 8px; }
  button, input { font: inherit; color: var(--text); background: var(--input); border: 1px solid var(--border); border-radius: 6px; }
  button { padding: 8px 12px; cursor: pointer; }
  input { padding: 8px; width: 100%; }
  .badge { font-size: 11px; font-weight: 700; padding: 2px 6px; border-radius: 4px; background: var(--input); color: var(--muted); }
  .on { background: var(--green); color: #000; } .warn { background: var(--yellow); color: #000; } .bad { background: var(--red); color: #fff; }
  .card { background: var(--panel); border: 1px solid var(--border); border-radius: 8px; padding: 12px; margin: 12px 0; }
  .track { font-size: 17px; font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .bar { height: 10px; background: var(--input); border-radius: 5px; overflow: hidden; margin: 10px 0 4px; cursor: pointer; }
  .fill { height: 100%; width: 0; background: var(--accent); }
  .times { display: flex; justify-content: space-between; font: 12px monospace; color: var(--muted); }
  .row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; margin-top: 10px; }
  .row input[type=range] { flex: 1; min-width: 120px; padding: 0; }
  ul { list-style: none; margin: 0; padding: 0; max-height: 40vh; overflow-y: auto; }
  li { display: flex; gap: 8px; align-items: center; padding: 7px 4px; border-bottom: 1px solid rgba(255,255,255,0.04); }
  li span { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  li small { color: var(--muted); font-family: monospace; }
  li.current { border-left: 3px solid var(--accent); padding-left: 6px; }
  #login { max-width: 360px; margin: 15vh auto; }
  .muted { color: var(--muted); font-size: 12px; }
  .error { color: var(--red); font-size: 12px; min-height: 16px; }
  .sub { margin-top: 16px; }
  .auto-period { margin: 8px 0 0; overflow-wrap: anywhere; }
  .kind { flex: 0 0 auto; font-size: 11px; font-weight: 700; padding: 2px 6px; border-radius: 4px; white-space: nowrap; background: var(--input); color: var(--muted); }
  .kind.music { background: #1f6feb; color: #fff; }
  .kind.imaging { background: var(--yellow); color: #000; }
  .kind.spot { background: var(--red); color: #fff; }
  .kind.other { background: var(--input); color: var(--muted); }
  .scroll { overflow-x: auto; }
  table { width: 100%; border-collapse: collapse; }
  th, td { text-align: left; padding: 6px 8px; border-bottom: 1px solid var(--border); white-space: nowrap; }
  th { color: var(--muted); font-size: 11px; text-transform: uppercase; letter-spacing: 1px; }
  td.missed { color: var(--red); font-weight: 700; }
</style>
</head>
<body>
<div id="login" hidden>
  <div class="card">
    <h2>RIARS</h2>
    <p class="muted" data-t="tokenHelp"></p>
    <form id="loginForm"><input id="token" type="password" autocomplete="current-password"><div class="row"><button data-t="enter"></button></div></form>
    <div class="error" id="loginError"></div>
  </div>
</div>
<div id="app" hidden>
<header><h1>RIARS</h1><span class="badge" id="stream"></span><span class="badge bad" id="deadair" hidden data-t="deadAir"></span><span class="badge" id="state"></span></header>
<section>
  <div class="card">
    <div class="track" id="track">—</div>
    <div class="bar" id="bar"><div class="fill" id="fill"></div></div>
    <div class="times"><span id="pos">0:00</span><span id="dur">0:00</span></div>
    <div class="row">
      <button data-cmd="play">&#9654;</button><button data-cmd="pause">&#10074;&#10074;</button>
      <button data-cmd="stop">&#9724;</button><button data-cmd="next">&#9197;</button>
      <input type="range" id="volume" min="0" max="1" step="0.01"><small id="volPct"></small>
    </div>
    <div class="error" id="error"></div>
  </div>
  <div class="card"><h2 data-t="playlist"></h2><ul id="playlist"></ul></div>
  <div class="card"><h2 data-t="library"></h2><input id="search" data-tp="search"><p class="muted" id="count"></p><ul id="results"></ul></div>
  <div class="card">
    <h2 data-t="automation"></h2>
    <div class="row" style="margin-top: 0; justify-content: space-between">
      <span class="muted" data-t="autoState"></span>
      <button id="autoToggle" class="badge" type="button" aria-pressed="false" data-t="off"></button>
    </div>
    <p class="muted auto-period" id="autoPeriod"></p>
    <h2 class="sub" data-t="warnings"></h2>
    <ul id="autoWarnings"></ul>
    <h2 class="sub" data-t="comingUp"></h2>
    <ul id="autoPreview"></ul>
    <p class="muted" data-t="previewHint"></p>
    <h2 class="sub" data-t="todayAds"></h2>
    <div class="scroll">
      <table>
        <thead><tr>
          <th data-t="advertiser"></th><th data-t="campaign"></th><th data-t="target"></th><th data-t="aired"></th><th data-t="missed"></th>
        </tr></thead>
        <tbody id="deliveryBody"></tbody>
      </table>
    </div>
    <h2 class="sub" data-t="downloads"></h2>
    <div class="row">
      <button id="dlPlay" type="button" data-t="downloadPlaylog"></button>
      <button id="dlDelivery" type="button" data-t="downloadDelivery"></button>
      <button id="dlSpots" type="button" data-t="downloadSpots"></button>
    </div>
  </div>
</section>
</div>
<script>
"use strict";
// Small, dependency-free control panel for headless RIARS servers. State comes over
// the WebSocket, which only sends changes; the playlist is refetched when the track
// changes, and the stream status is checked every 5 s while the page is visible.
const L = {
  en: { tokenHelp: "Enter the API token (riars-server --api-token, or the one printed at startup).", enter: "Enter",
        playlist: "Playlist", library: "Library", search: "Search…", tracks: "tracks", track: "track", badToken: "Wrong token",
        Playing: "ON AIR", Paused: "PAUSED", Stopped: "STOPPED", Connected: "STREAMING", Connecting: "CONNECTING",
        Error: "STREAM ERROR", Disconnected: "OFFLINE", deadAir: "SILENCE", empty: "Empty", lost: "Connection lost, retrying…",
        automation: "Automation", autoState: "State", on: "ON", off: "OFF", clock: "Clock", period: "Period",
        noPeriod: "No period", rule: "Rule", warnings: "Warnings", noWarnings: "No warnings",
        comingUp: "Coming up", previewHint: "Preview only. The Playlist card shows what is really on air.",
        todayAds: "Today's advertising", advertiser: "Advertiser", campaign: "Campaign", target: "Target",
        aired: "Aired", missed: "Missed", noAds: "No campaigns today", downloads: "Downloads",
        downloadPlaylog: "Play log (CSV)", downloadDelivery: "Delivery (CSV)", downloadSpots: "Spot log (CSV)",
        downloadError: "Could not download the file", none: "None",
        kindMusic: "Music", kindJingle: "Jingle", kindBumper: "Bumper", kindStationId: "Station ID",
        kindSweeper: "Sweeper", kindPromo: "Promo", kindSpot: "Spot", kindProgram: "Program", kindBed: "Bed", kindOther: "Other" },
  es: { tokenHelp: "Introduce el token de la API (riars-server --api-token, o el que se muestra al arrancar).", enter: "Entrar",
        playlist: "Lista de reproducción", library: "Biblioteca", search: "Buscar…", tracks: "pistas", track: "pista", badToken: "Token incorrecto",
        Playing: "AL AIRE", Paused: "PAUSA", Stopped: "DETENIDO", Connected: "EMITIENDO", Connecting: "CONECTANDO",
        Error: "ERROR DE STREAM", Disconnected: "DESCONECTADO", deadAir: "SILENCIO", empty: "Vacía", lost: "Conexión perdida, reintentando…",
        automation: "Automatización",
        autoState: "Estado",
        on: "ACTIVA",
        off: "PARADA",
        clock: "Reloj",
        period: "Franja",
        noPeriod: "Sin franja",
        rule: "Regla",
        warnings: "Avisos",
        noWarnings: "Sin avisos",
        comingUp: "Lo próximo",
        previewHint: "Solo es una vista previa. Lo que suena de verdad está en la lista de reproducción.",
        todayAds: "Publicidad de hoy",
        advertiser: "Anunciante",
        campaign: "Campaña",
        target: "Contratadas",
        aired: "Emitidas",
        missed: "Perdidas",
        noAds: "Hoy no hay campañas",
        downloads: "Descargas",
        downloadPlaylog: "Registro de emisiones (CSV)",
        downloadDelivery: "Cumplimiento (CSV)",
        downloadSpots: "Emisiones de cuñas (CSV)",
        downloadError: "No se ha podido descargar el archivo",
        none: "Ninguno",
        kindMusic: "Música",
        kindJingle: "Jingle",
        kindBumper: "Bumper",
        kindStationId: "Indicativo",
        kindSweeper: "Sweeper",
        kindPromo: "Promo",
        kindSpot: "Cuña",
        kindProgram: "Programa",
        kindBed: "Cama musical",
        kindOther: "Otro" },
};
const T = L[(navigator.language || "en").slice(0, 2)] || L.en;
document.querySelectorAll("[data-t]").forEach((el) => (el.textContent = T[el.dataset.t]));
document.querySelectorAll("[data-tp]").forEach((el) => (el.placeholder = T[el.dataset.tp]));
const $ = (id) => document.getElementById(id);
const store = { get() { try { return localStorage.getItem("riars.token"); } catch { return null; } },
                set(v) { try { v ? localStorage.setItem("riars.token", v) : localStorage.removeItem("riars.token"); } catch {} } };
// undefined: the first state always loads the playlist, even with nothing playing.
let token = store.get(), state = null, lastTrack = undefined, ws = null;
const fmt = (ms) => { const s = Math.floor(ms / 1000); return `${Math.floor(s / 60)}:${String(s % 60).padStart(2, "0")}`; };

async function api(path, body) {
  const r = await fetch("/api/v1" + path, { method: body === undefined ? "GET" : "POST",
    headers: { Authorization: "Bearer " + token, "Content-Type": "application/json" },
    body: body === undefined ? undefined : JSON.stringify(body) });
  if (r.status === 401) { logout(T.badToken); throw new Error("unauthorized"); }
  const text = await r.text();
  if (!r.ok) { let m = text; try { m = JSON.parse(text).error; } catch {} $("error").textContent = m; throw new Error(m); }
  $("error").textContent = "";
  try { return JSON.parse(text); } catch { return text; }
}

function render(s) {
  state = s;
  $("track").textContent = s.current_track || "—";
  $("state").textContent = T[s.state] || s.state;
  $("state").className = "badge" + (s.state === "Playing" ? " on" : s.state === "Paused" ? " warn" : "");
  $("deadair").hidden = !s.dead_air;
  $("fill").style.width = s.duration_ms ? (100 * s.position_ms / s.duration_ms) + "%" : "0";
  $("pos").textContent = fmt(s.position_ms); $("dur").textContent = fmt(s.duration_ms);
  if (document.activeElement !== $("volume")) { $("volume").value = s.volume; }
  $("volPct").textContent = Math.round(s.volume * 100) + "%";
  if (s.current_track !== lastTrack) { lastTrack = s.current_track; loadPlaylist(); }
}

async function loadPlaylist() {
  const pl = await api("/playlist").catch(() => null);
  if (!pl) return;
  $("playlist").replaceChildren(...(pl.items.length ? pl.items.map((it, i) => {
    const li = document.createElement("li");
    if (i === pl.current_index) li.className = "current";
    const name = document.createElement("span"); name.textContent = it.artist ? `${it.artist} — ${it.title}` : it.title;
    const dur = document.createElement("small"); dur.textContent = it.duration_ms ? fmt(it.duration_ms) : "";
    const play = document.createElement("button"); play.textContent = "▶";
    play.onclick = () => api("/playlist/play", { index: i }).then(loadPlaylist).catch(() => {});
    li.append(name, dur, play);
    return li;
  }) : [Object.assign(document.createElement("li"), { textContent: T.empty })]));
}

let searchTimer = 0;
async function search() {
  const q = encodeURIComponent($("search").value);
  const page = await api(`/library/query?search=${q}&limit=30`).catch(() => null);
  if (!page) return;
  $("count").textContent = `${page.total} ${page.total === 1 ? T.track : T.tracks}`;
  $("results").replaceChildren(...page.tracks.map((tr) => {
    const li = document.createElement("li");
    const name = document.createElement("span"); name.textContent = tr.artist ? `${tr.artist} — ${tr.title}` : tr.title;
    const add = document.createElement("button"); add.textContent = "+";
    add.onclick = () => api("/playlist/add", { path: tr.file_path, title: tr.title, artist: tr.artist }).then(loadPlaylist).catch(() => {});
    li.append(name, add);
    return li;
  }));
}

// --- Automation -----------------------------------------------------------
let autoStatus = null;
const autoLast = { preview: 0, delivery: 0 };
const autoPending = {};
const KIND_CLASS = { Music: "music", Jingle: "imaging", Bumper: "imaging", StationId: "imaging",
                     Sweeper: "imaging", Promo: "imaging", Spot: "spot" };
const hhmm = (text) => { const m = /T(\d{2}:\d{2})/.exec(text || ""); return m ? m[1] : "—"; };
const pad2 = (n) => String(n).padStart(2, "0");
const dayStart = () => { const d = new Date(); return `${d.getFullYear()}-${pad2(d.getMonth() + 1)}-${pad2(d.getDate())}T00:00:00`; };

function renderAutoStatus() {
  if (!autoStatus) return;
  const btn = $("autoToggle");
  btn.textContent = autoStatus.enabled ? T.on : T.off;
  btn.className = "badge" + (autoStatus.enabled ? " on" : "");
  btn.setAttribute("aria-pressed", autoStatus.enabled ? "true" : "false");
  const p = autoStatus.period;
  if (!p) {
    $("autoPeriod").textContent = T.noPeriod;
  } else {
    const source = p.clock_id ? `${T.clock}: ${p.clock_id}` : p.playlist_id ? `${T.playlist}: ${p.playlist_id}` : T.none;
    const parts = [source];
    if (p.rule_id) parts.push(`${T.rule}: ${p.rule_id}`);
    parts.push(`${hhmm(p.start)}–${hhmm(p.end)}`);
    $("autoPeriod").textContent = parts.join(" · ");
  }
  const warnings = (autoStatus.warnings || []).slice(-5).reverse();
  $("autoWarnings").replaceChildren(...(warnings.length ? warnings.map((w) => {
    const li = document.createElement("li");
    const time = document.createElement("small"); time.textContent = hhmm(w[0]);
    const msg = document.createElement("span"); msg.textContent = w[1];
    li.append(time, msg);
    return li;
  }) : [Object.assign(document.createElement("li"), { className: "muted", textContent: T.noWarnings })]));
}

async function loadStatus() {
  const s = await api("/automation/status").catch(() => null);
  if (!s) return;
  autoStatus = s;
  renderAutoStatus();
}

async function loadPreview() {
  const items = await api("/automation/preview?hours=1").catch(() => null);
  if (!items) return;
  $("autoPreview").replaceChildren(...(items.length ? items.slice(0, 10).map((it) => {
    const li = document.createElement("li");
    const time = document.createElement("small"); time.textContent = hhmm(it.planned_at);
    const kind = document.createElement("span");
    kind.className = "kind " + (KIND_CLASS[it.kind] || "other");
    kind.textContent = T["kind" + it.kind] || it.kind || T.kindOther;
    const name = document.createElement("span"); name.textContent = it.artist ? `${it.artist} — ${it.title}` : it.title;
    li.append(time, kind, name);
    return li;
  }) : [Object.assign(document.createElement("li"), { className: "muted", textContent: T.empty })]));
}

async function loadDelivery() {
  const rows = await api("/automation/delivery").catch(() => null);
  if (!rows) return;
  const list = rows.length ? rows.map((r) => {
    const tr = document.createElement("tr");
    [r.advertiser, r.campaign, r.target, r.aired, r.missed].forEach((value, i) => {
      const td = document.createElement("td"); td.textContent = String(value);
      if (i === 4 && r.missed > 0) td.className = "missed";
      tr.append(td);
    });
    return tr;
  }) : (() => {
    const tr = document.createElement("tr");
    const td = document.createElement("td");
    td.colSpan = 5; td.className = "muted"; td.textContent = T.noAds;
    tr.append(td); return tr;
  })();
  $("deliveryBody").replaceChildren(...(Array.isArray(list) ? list : [list]));
}

function loadAutomation() { loadStatus(); loadPreview(); loadDelivery(); }

function refreshSoon(key, task) {
  if (autoPending[key]) return;
  const wait = Math.max(0, 5000 - (Date.now() - autoLast[key]));
  autoPending[key] = setTimeout(() => {
    autoPending[key] = null;
    autoLast[key] = Date.now();
    task();
  }, wait);
}

function automationEvent(data) {
  if (data.generated > 0) refreshSoon("preview", () => { loadStatus(); loadPreview(); });
  if (data.logged > 0) refreshSoon("delivery", loadDelivery);
}

async function downloadCsv(path, fallback) {
  try {
    const r = await fetch("/api/v1" + path, { headers: { Authorization: "Bearer " + token } });
    if (r.status === 401) { logout(T.badToken); return; }
    if (!r.ok) {
      let message = await r.text();
      try { message = JSON.parse(message).error; } catch {}
      $("error").textContent = message;
      return;
    }
    const blob = await r.blob();
    const match = /filename="?([^";]+)"?/i.exec(r.headers.get("Content-Disposition") || "");
    const name = match ? match[1] : fallback;
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url; a.download = name;
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 1000);
  } catch { $("error").textContent = T.downloadError; }
}

async function streamStatus() {
  if (document.hidden) return;
  const s = await api("/stream").catch(() => null);
  const st = s && s.status ? s.status.state : "Disconnected";
  $("stream").textContent = T[st] || st;
  $("stream").className = "badge" + (st === "Connected" ? " on" : st === "Error" ? " bad" : st === "Connecting" ? " warn" : "");
}

function connect() {
  const proto = location.protocol === "https:" ? "wss" : "ws";
  ws = new WebSocket(`${proto}://${location.host}/ws/events?token=${encodeURIComponent(token)}`);
  ws.onmessage = (m) => {
    try {
      const data = JSON.parse(m.data);
      if (data.type === "automation") automationEvent(data);
      else render(data);
    } catch {}
  };
  ws.onclose = () => { if (token) { $("error").textContent = T.lost; setTimeout(connect, 2000); } };
  ws.onopen = () => { $("error").textContent = ""; };
}

async function start() {
  try { await api("/status"); } catch { return; }
  $("login").hidden = true; $("app").hidden = false;
  connect(); search(); streamStatus(); loadAutomation();
  setInterval(streamStatus, 5000);
  setInterval(() => { if (document.visibilityState !== "hidden") loadStatus(); }, 60000);
}
function logout(msg) {
  token = null; store.set(null); if (ws) ws.close();
  $("app").hidden = true; $("login").hidden = false; $("loginError").textContent = msg || "";
}

$("loginForm").onsubmit = (e) => { e.preventDefault(); token = $("token").value.trim(); store.set(token); start(); };
document.querySelectorAll("[data-cmd]").forEach((b) => (b.onclick = () => api("/player/" + b.dataset.cmd, {}).catch(() => {})));
$("volume").oninput = (e) => api("/player/volume", { level: Number(e.target.value) }).catch(() => {});
$("bar").onclick = (e) => {
  if (!state || !state.duration_ms) return;
  const r = e.currentTarget.getBoundingClientRect();
  api("/player/seek", { position_ms: Math.round((e.clientX - r.left) / r.width * state.duration_ms) }).catch(() => {});
};
$("search").oninput = () => { clearTimeout(searchTimer); searchTimer = setTimeout(search, 300); };
$("autoToggle").onclick = () => {
  const enabled = !(autoStatus && autoStatus.enabled);
  api("/automation/enable", { enabled }).then((config) => {
    autoStatus = Object.assign(autoStatus || { period: null, warnings: [] }, { enabled: config.enabled });
    renderAutoStatus(); loadStatus();
  }).catch(() => {});
};
$("dlPlay").onclick = () => downloadCsv("/automation/log.csv", "riars-log.csv");
$("dlDelivery").onclick = () => downloadCsv("/automation/delivery.csv", "riars-delivery.csv");
$("dlSpots").onclick = () => downloadCsv("/automation/campaign-log.csv?from=" + encodeURIComponent(dayStart()), "riars-campaign-log.csv");
if (token) start(); else logout();
</script>
</body>
</html>
