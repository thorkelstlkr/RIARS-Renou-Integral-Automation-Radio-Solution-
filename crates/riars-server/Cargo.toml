[package]
name = "riars-server"
description = "Headless RIARS server — runs on Raspberry Pi, Linux servers, and anywhere without a GUI"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "riars-server"
path = "src/main.rs"

[dependencies]
riars-stream = { path = "../riars-stream" }
riars-rds = { path = "../riars-rds" }
uuid = { workspace = true }
riars-core = { path = "../riars-core" }
riars-api = { path = "../riars-api" }
riars-mcp = { path = "../riars-mcp" }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
log = { workspace = true }
env_logger = { workspace = true }
clap = { version = "4", features = ["derive"] }
